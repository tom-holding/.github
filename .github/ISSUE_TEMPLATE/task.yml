name: Task
description: Create a piece of work that needs to be completed
type: Task
projects: ["tom-holding/1"]

body:
  - type: textarea
    id: description
    attributes:
      label: Description
      description: Describe what needs to be done and why.
      placeholder: Describe the task...
    validations:
      required: true

  - type: textarea
    id: acceptance-criteria
    attributes:
      label: Acceptance criteria
      description: Describe what must be true for this task to be considered complete.
      placeholder: |
        - [ ] ...
        - [ ] ...
    validations:
      required: false

  - type: textarea
    id: additional-context
    attributes:
      label: Additional context
      description: Add relevant links, dependencies, technical notes, or other useful information.
    validations:
      required: false